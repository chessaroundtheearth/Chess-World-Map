body{margin:0;background:#000;color:#eee;font-family:system-ui,sans-serif}
.wrap{padding:12px;max-width:1400px;margin:0 auto;position:relative}

.stats{font-size:.8rem;color:#bbb;margin-bottom:8px}
#mapbox{position:relative;background:#a9c7e8;border-radius:8px;overflow:hidden}
#map svg{display:block;width:100%;height:auto}
.country{stroke:#3d5a78;stroke-width:.4;cursor:pointer}
.country:hover{stroke:#fff;stroke-width:1}
.pin{stroke:#000;stroke-width:.6;cursor:pointer}
.pin.nation{fill:#ffd34d}.pin.city{fill:#58d68d}
.pin:hover,.pin.sel{stroke:#fff;stroke-width:1.6}
.corner{position:absolute;width:70px;height:70px;pointer-events:none;border-radius:50%}
.tl{top:8px;left:8px}.tr{top:8px;right:8px}.bl{bottom:8px;left:8px}.br{bottom:8px;right:8px}
#panel{margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:760px){#panel{grid-template-columns:1fr}}
.card{background:#111;border:1px solid #333;border-radius:8px;padding:10px}
.card h2{font-size:.8rem;margin:0 0 6px;color:#9aa;text-transform:uppercase}
input,select{width:100%;box-sizing:border-box;padding:7px;background:#000;color:#eee;border:1px solid #444;border-radius:6px}
.row{display:flex;justify-content:space-between;gap:8px;padding:5px 7px;border-radius:6px;cursor:pointer;font-size:.8rem}
.row:hover,.row.sel{background:#223}
.row .m{color:#888;white-space:nowrap}
.detail{font-size:.85rem;line-height:1.5}
.detail a{color:#7cc4ff;word-break:break-all}
.muted{color:#888}
#tip{position:fixed;pointer-events:none;background:#111;border:1px solid #444;border-radius:6px;padding:4px 8px;font-size:.78rem;display:none;z-index:9;color:#fff}

function centroidOf(name){ name=strip(name);
  var r=ISO_BY[name]; if(!r) return null;
  var lat=parseFloat(r[2]), lon=parseFloat(r[3]);
  return proj([lon,lat]);
}

function placePins(){
  g.selectAll("circle.pin").remove();
  var vis=pins.filter(visible);
  var byCountry={};
  vis.forEach(function(p){ var k=p.country||p.name; byCountry[k]=(byCountry[k]||0)+1; });
  var seen={};
  vis.forEach(function(p){
    var base=centroidOf(p.country)||centroidOf(p.name);
    if(!base) return;
    var k=p.country||p.name; seen[k]=(seen[k]||0)+1;
    var n=seen[k]-1, ang=n*2.399, rad=(n===0?0:4+n*1.5);
    var x=base[0]+Math.cos(ang)*rad, y=base[1]+Math.sin(ang)*rad;
    if(isNaN(x)||isNaN(y)) return;
    g.append("circle").attr("class","pin "+p.kind+(selected===p?" sel":""))
      .attr("cx",x).attr("cy",y).attr("r0",p.kind==="nation"?5:3.5).attr("r",p.kind==="nation"?5:3.5)
      .on("click",function(e){ e.stopPropagation(); select(p); })
      .on("mousemove",function(e){ tip.style("display","block").style("left",(e.clientX+12)+"px").style("top",(e.clientY+12)+"px").text(p.label+" ("+(p.kind==="nation"?"National team":"City")+")"); })
      .on("mouseleave",function(){ tip.style("display","none"); });
  });
}

function norm(s){ return String(s).normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]/gi,"").toLowerCase(); }
function pickCountry(name){
  var nn=norm(name);
  var alt={"macedonia":"northmacedonia","northmacedonia":"northmacedonia"};
  nn=alt[nn]||nn;
  var hit=pins.filter(function(p){ return p.kind==="nation" && (norm(p.country)===nn || norm(p.name)===nn); });
  if(hit.length){ select(hit[0]); return; }
  var list2=pins.filter(function(p){ return p.kind==="nation" && (p.country===name || p.name===name); });
  if(list2.length) select(list2[0]);
  else d3.select("#detail").html("<span class='muted'>No team listed for "+esc(name)+".</span>");
}
function linkify(text){
  return esc(text).replace(/(https?:\/\/[^\s<]+)/g,function(u){return "<a href='"+u+"' target='_blank' rel='noopener'>"+u+"</a>";})
    .replace(/(^|\s)(mailto:[^\s<]+)/g,function(m,a,u){return a+"<a href='"+u+"'>"+u.replace("mailto:","")+"</a>";});
}
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function select(p){
